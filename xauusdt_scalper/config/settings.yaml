# XAUUSDT Omniscient Scalper v14.0 Configuration
symbol: "XAUUSDT"
base_url: "https://fapi.binance.com"
ws_url: "wss://fstream.binance.com/ws"

# Timeframes required
timeframes:
  - "1m"
  - "3m"
  - "5m"
  - "15m"
  - "1h"
  - "4h"
  - "1d"

# Data refresh intervals (seconds)
refresh_intervals:
  ticker: 5
  book_ticker: 5
  mark_price: 5
  klines: 15
  depth: 10
  derivatives: 30
  full_swarm: 60

# Agent Swarm Configuration
swarm:
  total_agents: 500
  majority_threshold: 251
  min_confidence: 55.0
  categories:
    candlestick: 50      # Agents 1.1-5.10
    support_resistance: 50   # Agents 6.1-10.10
    trend: 50           # Agents 11.1-15.10
    volume_profile: 50     # Agents 16.1-20.10
    order_flow: 50       # Agents 21.1-25.10
    momentum: 50         # Agents 26.1-30.10
    ma_volatility: 50    # Agents 31.1-35.10
    market_structure: 50 # Agents 36.1-40.10
    confluence: 50       # Agents 41.1-45.10
    system: 50           # Agents 46.1-50.10

# Category weights for weighted voting
category_weights:
  candlestick: 1.0
  support_resistance: 1.0
  trend: 1.1
  volume_profile: 1.1
  order_flow: 1.2
  momentum: 1.1
  ma_volatility: 1.0
  market_structure: 1.2
  confluence: 1.3
  system: 1.0

# Risk Management
risk:
  base_risk_pct: 1.0
  low_vol_risk_pct: 0.5
  high_vol_risk_pct: 0.7
  max_leverage: 10.0
  high_vol_leverage: 5.0
  extreme_vol_leverage: 3.0
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 7.0
  max_drawdown_per_trade: 1.0
  min_rr_ratio: 1.5
  target_rr_ratio: 2.5
  ideal_rr_ratio: 3.0
  atr_stop_multiplier: 1.5
  atr_tp_multiplier: 2.5

# Volatility Regime
volatility:
  low_threshold: 0.1
  normal_min: 0.1
  normal_max: 0.3
  high_threshold: 0.3
  extreme_threshold: 0.5
  atr_period: 14

# Gate Thresholds
gates:
  gate1_max_data_age: 60      # seconds
  gate2_atr_pct_min: 0.08
  gate2_atr_pct_max: 0.45
  gate2_max_spread: 0.15
  gate3_min_agents: 251
  gate3_min_confidence: 55.0
  gate4_max_sl_atr: 1.5
  gate4_min_rr: 1.5
  gate4_max_leverage: 10.0
  gate5_max_imbalance_against: 80.0

# Signal timing
signal:
  validity_minutes: 12
  refresh_seconds: 5
  stale_threshold_seconds: 120

# UI Configuration
ui:
  theme: "bloomberg"
  fullscreen: false
  sound_enabled: true
  update_interval_ms: 1000
  chart_candles: 200
  order_book_levels: 12
  log_retention_days: 30

# API Limits
api:
  weight_limit_per_minute: 1200
  weight_warning_threshold: 1000
  rate_limit_backoff: 10
  max_retries: 3
  timeout: 10